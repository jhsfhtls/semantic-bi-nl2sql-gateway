schema_version: "1.0.0"
updated_at: "2026-11-23"
standard: "ADR-003 (Power BI PBIP / TMDL + Power Query M + WCAG AA)"

dax_templates:
  - template_id: "BASE_SIMPLE"
    category: "Base"
    status: "IMPLEMENTED"
    description: "Additive base DAX measure compiled directly from certified semantic metric expression."
    pattern: "{measure_label} = {dax_aggregation}"
  - template_id: "BASE_RATIO"
    category: "Base"
    status: "IMPLEMENTED"
    description: "Zero-safe ratio measure compiled via DIVIDE(numerator, denominator, BLANK())."
    pattern: "{measure_label} = DIVIDE([{num_measure}], [{den_measure}], BLANK())"
  - template_id: "TIME_YTD"
    category: "Time Intelligence"
    status: "IMPLEMENTED"
    description: "Year-to-date cumulative calculation bound to conformed dim_date[date_day]."
    pattern: "{measure_label} YTD = TOTALYTD([{measure_label}], 'dim_date'[date_day])"
  - template_id: "TIME_YOY_PCT"
    category: "Time Intelligence"
    status: "IMPLEMENTED"
    description: "Year-over-year percentage variance using SAMEPERIODLASTYEAR and defensive DIVIDE."
    pattern: "{measure_label} YoY % = VAR _py = CALCULATE([{measure_label}], SAMEPERIODLASTYEAR('dim_date'[date_day])) RETURN DIVIDE([{measure_label}] - _py, _py, BLANK())"
  - template_id: "TIME_MOM_PCT"
    category: "Time Intelligence"
    status: "IMPLEMENTED"
    description: "Month-over-month percentage variance using DATEADD(..., -1, MONTH)."
    pattern: "{measure_label} MoM % = VAR _pm = CALCULATE([{measure_label}], DATEADD('dim_date'[date_day], -1, MONTH)) RETURN DIVIDE([{measure_label}] - _pm, _pm, BLANK())"
  - template_id: "TIME_ROLLING_12M"
    category: "Time Intelligence"
    status: "IMPLEMENTED"
    description: "Rolling 12-month window calculation over dim_date[date_day]."
    pattern: "{measure_label} R12M = CALCULATE([{measure_label}], DATESINPERIOD('dim_date'[date_day], MAX('dim_date'[date_day]), -12, MONTH))"
  - template_id: "TARGET_BASE"
    category: "Target & Variance"
    status: "IMPLEMENTED"
    description: "Target benchmark measure compiled from certified target_expression."
    pattern: "{measure_label} Target = {target_dax}"
  - template_id: "TARGET_VARIANCE"
    category: "Target & Variance"
    status: "IMPLEMENTED"
    description: "Absolute variance against target ([Base] - [Target])."
    pattern: "{measure_label} Variance vs Target = [{measure_label}] - [{measure_label} Target]"
  - template_id: "TARGET_VARIANCE_PCT"
    category: "Target & Variance"
    status: "IMPLEMENTED"
    description: "Relative percentage variance against target via DIVIDE."
    pattern: "{measure_label} Variance vs Target % = DIVIDE([{measure_label}] - [{measure_label} Target], [{measure_label} Target], BLANK())"

power_query_connectors:
  - target_id: "duckdb"
    status: "IMPLEMENTED"
    connector_fn: "Odbc.DataSource"
    parameters: ["pDatabasePath", "pSchemaName"]
    description: "Parameterized local/CI DuckDB analytical table loader with explicit type contracts."
  - target_id: "databricks"
    status: "IMPLEMENTED"
    connector_fn: "Databricks.Catalogs"
    parameters: ["pServerHostname", "pHttpPath", "pCatalog", "pSchema"]
    description: "Parameterized Unity Catalog Lakehouse connector for enterprise Power BI delivery."
  - target_id: "snowflake"
    status: "IMPLEMENTED"
    connector_fn: "Snowflake.Databases"
    parameters: ["pAccountServer", "pWarehouse", "pDatabase", "pSchema"]
    description: "Parameterized Snowflake virtual warehouse connector without embedded credentials."
