schema_version: "1.0.0"
project_name: "semantic-bi-nl2sql-gateway"
default_dialect: "duckdb"

security:
  default_limit: 100
  max_limit: 1000
  query_timeout_seconds: 10
  blocked_sensitive_columns:
    - "cpf"
    - "cpf_raw"
    - "cnpj_pf"
    - "email"
    - "phone"
    - "telefone"
    - "celular"
    - "endereco_completo"
    - "rg"
    - "salary_raw"
  blocked_column_patterns:
    - "(?i)^.*(cpf|cnpj_pf|email|phone|telefone|celular|endereco|password|secret|token|api_key).*$"
    - "(?i)(^|_)rg(_|$)"
  allowed_functions:
    - "SUM"
    - "COUNT"
    - "AVG"
    - "MIN"
    - "MAX"
    - "COALESCE"
    - "NULLIF"
    - "CASE"
    - "CAST"
    - "ROUND"
    - "DATE_TRUNC"
    - "EXTRACT"
    - "STRFTIME"
    - "ABS"
    - "LOWER"
    - "UPPER"
    - "TRIM"

semantic_models:
  - name: "dim_date"
    role: "dimension"
    table: "dim_date"
    grain: "One row per calendar day"
    primary_key: "date_day"
    time_dimension: "date_day"
    source_lakehouse: "synthetic_embedded"
    description: "Conformed calendar dimension supporting fiscal, quarterly, and monthly rollups."
    columns:
      - name: "date_day"
        type: "DATE"
        role: "primary_key"
        description: "Calendar date primary key (YYYY-MM-DD)."
        synonyms: ["data", "date", "dia", "day"]
      - name: "year_num"
        type: "INTEGER"
        role: "dimension"
        description: "Four-digit calendar year."
        synonyms: ["ano", "year"]
      - name: "quarter_num"
        type: "INTEGER"
        role: "dimension"
        description: "Calendar quarter number (1-4)."
      - name: "quarter_label"
        type: "VARCHAR"
        role: "dimension"
        description: "Formatted quarter label (e.g., 2026-Q1)."
        synonyms: ["trimestre", "quarter"]
      - name: "month_num"
        type: "INTEGER"
        role: "dimension"
        description: "Calendar month number (1-12)."
      - name: "month_name"
        type: "VARCHAR"
        role: "dimension"
        description: "English month name."
        synonyms: ["mes", "month"]
      - name: "year_month"
        type: "VARCHAR"
        role: "dimension"
        description: "Year and month label (YYYY-MM)."
        synonyms: ["ano_mes", "competencia", "periodo", "year_month"]
      - name: "is_weekend"
        type: "BOOLEAN"
        role: "attribute"
        description: "True when the calendar day falls on Saturday or Sunday."
      - name: "fiscal_year"
        type: "INTEGER"
        role: "dimension"
        description: "Corporate fiscal year."

  - name: "dim_region"
    role: "dimension"
    table: "dim_region"
    grain: "One row per commercial region / Brazilian state (UF)"
    primary_key: "region_id"
    time_dimension: null
    source_lakehouse: "public-data-gateway"
    description: "Conformed geographic region dimension aligned with IBGE UF codes."
    columns:
      - name: "region_id"
        type: "VARCHAR"
        role: "primary_key"
        description: "Canonical string region identifier."
      - name: "region_name"
        type: "VARCHAR"
        role: "dimension"
        description: "Human-readable geographic region name."
        synonyms: ["regiao", "region", "localidade"]
      - name: "uf_code"
        type: "VARCHAR"
        role: "dimension"
        description: "Two-letter Brazilian state abbreviation (UF)."
        synonyms: ["uf", "estado", "state"]
      - name: "macro_region"
        type: "VARCHAR"
        role: "dimension"
        description: "IBGE macro-region name (Norte, Nordeste, Centro-Oeste, Sudeste, Sul)."
        synonyms: ["macrorregiao", "macro_region"]
      - name: "country_code"
        type: "VARCHAR"
        role: "attribute"
        description: "ISO 3166-1 alpha-2 country code."
      - name: "currency_code"
        type: "VARCHAR"
        role: "attribute"
        description: "Reporting currency code (BRL)."

  - name: "dim_customer_segment"
    role: "dimension"
    table: "dim_customer_segment"
    grain: "One row per B2B customer commercial segment"
    primary_key: "segment_id"
    time_dimension: null
    source_lakehouse: "finops-capex-revenue-lakehouse"
    description: "Conformed B2B customer segment classification."
    columns:
      - name: "segment_id"
        type: "VARCHAR"
        role: "primary_key"
        description: "Canonical customer segment key."
      - name: "segment_name"
        type: "VARCHAR"
        role: "dimension"
        description: "Commercial segment name (Enterprise, Mid-Market, SMB, Public Sector)."
        synonyms: ["segmento", "segment", "cliente_segmento"]
      - name: "tier_group"
        type: "VARCHAR"
        role: "dimension"
        description: "Strategic account tier grouping."
      - name: "account_band"
        type: "VARCHAR"
        role: "attribute"
        description: "Annual contract value band label."
      - name: "is_enterprise"
        type: "BOOLEAN"
        role: "attribute"
        description: "True for strategic Enterprise accounts."

  - name: "dim_service_tier"
    role: "dimension"
    table: "dim_service_tier"
    grain: "One row per operational support SLA tier"
    primary_key: "service_tier_id"
    time_dimension: null
    source_lakehouse: "ops-sla-telemetry-lakehouse"
    description: "Conformed operational SLA priority tier and calendar policy."
    columns:
      - name: "service_tier_id"
        type: "VARCHAR"
        role: "primary_key"
        description: "Canonical service tier key."
      - name: "service_tier_name"
        type: "VARCHAR"
        role: "dimension"
        description: "Service tier name (Gold 24x7, Silver Business Hours, Standard)."
        synonyms: ["nivel_servico", "service_tier", "tier"]
      - name: "priority_level"
        type: "VARCHAR"
        role: "dimension"
        description: "Incident severity priority code (P1, P2, P3)."
        synonyms: ["prioridade", "priority"]
      - name: "sla_target_hours"
        type: "DECIMAL(10,2)"
        role: "attribute"
        description: "Contractual SLA resolution target in hours."
      - name: "support_window"
        type: "VARCHAR"
        role: "attribute"
        description: "Applicable SLA calendar window (24x7 or Business Hours)."

  - name: "fct_revenue_orders"
    role: "fact"
    table: "fct_revenue_orders"
    grain: "One row per recognized B2B revenue order"
    primary_key: "order_id"
    time_dimension: "order_date"
    source_lakehouse: "finops-capex-revenue-lakehouse"
    description: "Synthetically generated B2B order revenue, discount, direct cost, and target ledger."
    columns:
      - name: "order_id"
        type: "VARCHAR"
        role: "primary_key"
        description: "Canonical order identifier."
      - name: "order_date"
        type: "DATE"
        role: "time_dimension"
        description: "Revenue recognition date."
      - name: "region_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_region."
      - name: "segment_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_customer_segment."
      - name: "service_tier_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_service_tier."
      - name: "gross_revenue_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Gross recognized order value in BRL."
      - name: "discount_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Commercial discount applied in BRL."
      - name: "net_revenue_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Net recognized revenue in BRL after discounts."
      - name: "direct_cost_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Direct delivery cost in BRL."
      - name: "gross_margin_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Gross margin contribution in BRL (net_revenue_brl - direct_cost_brl)."
      - name: "target_revenue_brl"
        type: "DECIMAL(18,4)"
        role: "measure"
        description: "Budgeted target net revenue in BRL."
      - name: "order_status"
        type: "VARCHAR"
        role: "dimension"
        description: "Order billing status (INVOICED, COLLECTED, PENDING)."
        synonyms: ["status_pedido", "order_status"]

  - name: "fct_sla_tickets"
    role: "fact"
    table: "fct_sla_tickets"
    grain: "One row per operational service ticket"
    primary_key: "ticket_id"
    time_dimension: "created_date"
    source_lakehouse: "ops-sla-telemetry-lakehouse"
    description: "Synthetically generated service-order SLA telemetry and resolution times."
    columns:
      - name: "ticket_id"
        type: "VARCHAR"
        role: "primary_key"
        description: "Canonical service ticket identifier."
      - name: "created_date"
        type: "DATE"
        role: "time_dimension"
        description: "Ticket creation date."
      - name: "region_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_region."
      - name: "segment_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_customer_segment."
      - name: "service_tier_id"
        type: "VARCHAR"
        role: "foreign_key"
        description: "Foreign key to dim_service_tier."
      - name: "resolution_hours"
        type: "DECIMAL(12,4)"
        role: "measure"
        description: "Elapsed active resolution time in hours."
      - name: "is_sla_met"
        type: "INTEGER"
        role: "measure"
        description: "Binary indicator (1 = met SLA, 0 = breached)."
      - name: "is_breached"
        type: "INTEGER"
        role: "measure"
        description: "Binary indicator (1 = SLA breached, 0 = within SLA)."
      - name: "ticket_status"
        type: "VARCHAR"
        role: "dimension"
        description: "Ticket lifecycle status (COMPLETED, SLA_BREACHED, IN_EXECUTION)."
        synonyms: ["status_chamado", "ticket_status"]

allowed_joins:
  - name: "revenue_to_date"
    left_model: "fct_revenue_orders"
    right_model: "dim_date"
    left_key: "order_date"
    right_key: "date_day"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "revenue_to_region"
    left_model: "fct_revenue_orders"
    right_model: "dim_region"
    left_key: "region_id"
    right_key: "region_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "revenue_to_segment"
    left_model: "fct_revenue_orders"
    right_model: "dim_customer_segment"
    left_key: "segment_id"
    right_key: "segment_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "revenue_to_service_tier"
    left_model: "fct_revenue_orders"
    right_model: "dim_service_tier"
    left_key: "service_tier_id"
    right_key: "service_tier_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "sla_to_date"
    left_model: "fct_sla_tickets"
    right_model: "dim_date"
    left_key: "created_date"
    right_key: "date_day"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "sla_to_region"
    left_model: "fct_sla_tickets"
    right_model: "dim_region"
    left_key: "region_id"
    right_key: "region_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "sla_to_segment"
    left_model: "fct_sla_tickets"
    right_model: "dim_customer_segment"
    left_key: "segment_id"
    right_key: "segment_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true
  - name: "sla_to_service_tier"
    left_model: "fct_sla_tickets"
    right_model: "dim_service_tier"
    left_key: "service_tier_id"
    right_key: "service_tier_id"
    join_type: "left"
    cardinality: "many_to_one"
    safe_for_aggregation: true

metrics:
  - name: "total_revenue"
    label: "Total Net Revenue (BRL)"
    description: "Total recognized net revenue in BRL after commercial discounts."
    model: "fct_revenue_orders"
    type: "simple"
    expression: "SUM(net_revenue_brl)"
    format: "#,##0.00"
    display_folder: "Finance\\Revenue"
    time_intelligence: true
    target_expression: "SUM(target_revenue_brl)"
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_date.year_num"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_region.macro_region"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
      - "fct_revenue_orders.order_status"
    synonyms: ["receita total", "receita liquida", "faturamento", "net revenue", "revenue"]
    owner: "FinOps & Revenue Governance"
    certified: true

  - name: "total_gross_margin"
    label: "Total Gross Margin (BRL)"
    description: "Total gross margin contribution in BRL (net revenue minus direct delivery cost)."
    model: "fct_revenue_orders"
    type: "simple"
    expression: "SUM(gross_margin_brl)"
    format: "#,##0.00"
    display_folder: "Finance\\Margins"
    time_intelligence: true
    target_expression: null
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
    synonyms: ["margem bruta", "gross margin", "lucro bruto"]
    owner: "FinOps & Revenue Governance"
    certified: true

  - name: "order_count"
    label: "Order Count"
    description: "Distinct count of recognized revenue orders."
    model: "fct_revenue_orders"
    type: "simple"
    expression: "COUNT(DISTINCT order_id)"
    format: "#,##0"
    display_folder: "Finance\\Volume"
    time_intelligence: true
    target_expression: null
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
      - "fct_revenue_orders.order_status"
    synonyms: ["quantidade de pedidos", "numero de pedidos", "total de pedidos", "orders"]
    owner: "Commercial Analytics"
    certified: true

  - name: "average_order_value"
    label: "Average Order Value (BRL)"
    description: "Net revenue divided by distinct recognized orders."
    model: "fct_revenue_orders"
    type: "ratio"
    numerator: "SUM(net_revenue_brl)"
    denominator: "COUNT(DISTINCT order_id)"
    expression: "SUM(net_revenue_brl) / NULLIF(COUNT(DISTINCT order_id), 0)"
    format: "#,##0.00"
    display_folder: "Finance\\Unit Economics"
    time_intelligence: true
    target_expression: null
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
    synonyms: ["ticket medio", "aov", "valor medio do pedido", "average ticket"]
    owner: "Commercial Analytics"
    certified: true

  - name: "gross_margin_pct"
    label: "Gross Margin (%)"
    description: "Ratio of total gross margin to total net revenue."
    model: "fct_revenue_orders"
    type: "ratio"
    numerator: "SUM(gross_margin_brl)"
    denominator: "SUM(net_revenue_brl)"
    expression: "SUM(gross_margin_brl) / NULLIF(SUM(net_revenue_brl), 0)"
    format: "0.00%"
    display_folder: "Finance\\Margins"
    time_intelligence: true
    target_expression: "0.65"
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
    synonyms: ["margem bruta percentual", "gross margin pct", "margem %"]
    owner: "FinOps & Revenue Governance"
    certified: true

  - name: "ticket_count"
    label: "Service Ticket Count"
    description: "Distinct count of operational service tickets."
    model: "fct_sla_tickets"
    type: "simple"
    expression: "COUNT(DISTINCT ticket_id)"
    format: "#,##0"
    display_folder: "Operations\\Volume"
    time_intelligence: true
    target_expression: null
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
      - "dim_service_tier.priority_level"
      - "fct_sla_tickets.ticket_status"
    synonyms: ["quantidade de chamados", "tickets", "chamados", "volume de tickets"]
    owner: "SRE & Field Operations"
    certified: true

  - name: "sla_compliance_rate"
    label: "SLA Compliance Rate (%)"
    description: "Share of operational service tickets resolved within contractual SLA targets."
    model: "fct_sla_tickets"
    type: "ratio"
    numerator: "SUM(is_sla_met)"
    denominator: "COUNT(DISTINCT ticket_id)"
    expression: "SUM(is_sla_met) / NULLIF(COUNT(DISTINCT ticket_id), 0)"
    format: "0.00%"
    display_folder: "Operations\\SLA"
    time_intelligence: true
    target_expression: "0.99"
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
      - "dim_service_tier.priority_level"
    synonyms: ["taxa de sla", "sla compliance", "aderencia sla", "cumprimento de sla"]
    owner: "SRE & Field Operations"
    certified: true

  - name: "mttr_hours"
    label: "Mean Time To Resolution (Hours)"
    description: "Average resolution duration in hours across service tickets."
    model: "fct_sla_tickets"
    type: "ratio"
    numerator: "SUM(resolution_hours)"
    denominator: "COUNT(DISTINCT ticket_id)"
    expression: "SUM(resolution_hours) / NULLIF(COUNT(DISTINCT ticket_id), 0)"
    format: "#,##0.00"
    display_folder: "Operations\\SLA"
    time_intelligence: true
    target_expression: "12.0"
    dimensions:
      - "dim_date.year_month"
      - "dim_date.quarter_label"
      - "dim_region.region_name"
      - "dim_region.uf_code"
      - "dim_customer_segment.segment_name"
      - "dim_service_tier.service_tier_name"
      - "dim_service_tier.priority_level"
    synonyms: ["mttr", "tempo medio de resolucao", "mean time to resolution"]
    owner: "SRE & Field Operations"
    certified: true
